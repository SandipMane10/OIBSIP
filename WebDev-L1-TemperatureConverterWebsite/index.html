<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="main">
        <Div class="cart">
            <br><h2>Temperature Converter</h2>

            <div id="status" class="status-badge">Enter a Temperature</div>
            <div id="error" class="error-message" style="color: red; margin-bottom: 10px;"></div>
            
            <div class="input-group">
                <label for="celsius">Celsius (C)</label><br>
                <input type="number" id="celsius" step="any" placeholder="Enter Celsius">
            </div> <br>

            <div class="input-group">
                <label for="fahrenheit">Fahrenheit (F)</label><br>
                <input type="number" id="fahrenheit" step="any" placeholder="Enter Fahrenheit">
            </div><br>

            <div class="input-group">
                <label for="kelvin">Kelvin (k)</label><br>
                <input type="number" id="kelvin" step="any" placeholder="Enter kelvin">
            </div> <br>
        </Div>
    </section>
    <script src="script.js"></script>
</body>
</html>
